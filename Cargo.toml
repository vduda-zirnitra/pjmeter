[package]
name = "pjmeter"
version = "0.1.1"
edition = "2024"
rust-version = "1.85.0"
authors = ["Victor Duda"]
description = "A helping tool to execute JMeter test plans on any project"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
clap = { version = "4.5.57", features = ["derive", "cargo"] }
anyhow = "1.0.99"
chrono = "0.4.41"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
dirs = "6.0.0"
toml = "0.9.5"
serde = {  version = "1.0.219", features = ["derive"] }
reqwest = { version = "0.12.23", features = ["blocking", "json", "stream"] }
tempfile = "3.20.0"
zip = "6.0.0"
[target.'cfg(unix)'.dependencies]
uzers = "0.11.0"
libc = "0.2.174"
indicatif = "0.18.0"
dialoguer = "0.12.0"
console = "0.16.0"
tabled = "0.20.0"
futures-util = "0.3.31"
